services:
  - type: web
    name: alumni-connect-backend
    env: node
    plan: free
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /

  - type: web
    name: alumni-connect-frontend
    env: static
    rootDir: frontemd
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
