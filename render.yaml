# 
services:
  - type: web
    name: alumni-connect-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
    healthCheckPath: /

  - type: web
    name: alumni-connect-frontend
    env: static
    rootDir: frontemd
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
